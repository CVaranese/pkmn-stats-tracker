# Publishes the site to GitHub Pages: main's site/ at the root (the live site), the next branch's site/ under next/
# (the preview of the next version, reached only from the hidden link on Pinecord's banner).
# Runs on a push to main, and after "Preview pushed" (preview.yml) finishes for a push to next: workflow_run always
# runs this file from main, so the deploy never comes from another branch (the github-pages environment may allow
# main only). Both parts are rebuilt every time, so a push to either branch keeps the other one as it is.
# main's tests (tests/test_tools.py, tests/index.html in headless Chrome) run first: FAIL or CRASH means no deploy,
# and the live site stays as it was.
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Preview pushed"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to commit SHAs (a moved tag can't change what runs); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: live
          fetch-depth: 0          # tags too: test_tools.py checks every release is tagged
          persist-credentials: false
      # No deploy unless main's tests pass (the live site is assumed in use). next's aren't run: a broken preview
      # is allowed and shouldn't hold up the live site.
      - name: Test main
        working-directory: live
        run: |
          python3 -I tests/test_tools.py
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/tests/ >/dev/null && break; sleep 0.25; done
          dom=$(google-chrome --headless=new --disable-gpu --no-sandbox --user-data-dir="$RUNNER_TEMP/chrome" \
            --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8765/tests/index.html 2>/dev/null)
          title=$(printf '%s' "$dom" | grep -o '<title>[^<]*' | head -1 | cut -c8-)
          echo "tests/index.html: ${title:-no title}"
          if [ "$title" != "PASS" ]; then
            printf '%s' "$dom" | sed -n '/id="out"/,/<\/pre>/p' | grep -E '^(FAIL|  )' | head -40
            exit 1
          fi
      - id: next
        name: Is there a next branch?
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" next >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.next.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: next
          path: preview
          persist-credentials: false
      - name: Put the two together
        run: |
          cp -r live/site _site
          if [ -d preview/site ]; then
            rm -rf _site/next
            cp -r preview/site _site/next
            python3 live/.github/workflows/mark_preview.py _site/next
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
