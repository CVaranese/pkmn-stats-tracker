<!doctype html><body><img src="/hold" style="display:none">
<script>
// Served by tools/video/video_frames.py. ?t=60,70&box=x,y,w,h&scale=2 : seeks /video.mp4 to each time, draws the box
// (1280x720 frame coordinates) at `scale`, and POSTs it as PNG to /save?name=f<t*10>.png. Then POSTs a summary to /done.
const q = new URLSearchParams(location.search);
const times = q.get("t").split(",").map(Number);
const [bx, by, bw, bh] = q.get("box").split(",").map(Number);
const scale = Number(q.get("scale"));
const done = (msg) => fetch("/done", { method: "POST", body: msg });
window.onerror = (m) => done("ERR " + m);
(async () => {
  let v, reloads = 0;
  const open = () => new Promise((r) => {   // a fresh element; the old one's decoder can wedge for good
    v = document.createElement("video");
    v.muted = true;
    v.preload = "auto";
    v.addEventListener("loadeddata", () => r(true), { once: true });
    setTimeout(() => r(false), 15000);
    v.src = "/video.mp4?n=" + reloads;
  });
  if (!(await open())) return done("VIDEO ERR no data");
  const c = document.createElement("canvas");
  c.width = Math.round(bw * scale); c.height = Math.round(bh * scale);
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  if (q.get("filter")) g.filter = q.get("filter");  // e.g. "grayscale(1) contrast(1.6)"
  const sx = v.videoWidth / 1280, sy = v.videoHeight / 720;
  // A seek in a long file sometimes never fires "seeked", and then no later seek does either: retry a little
  // off the time, then on a new video element, then skip the frame.
  const seek = (t) => new Promise((r) => {
    const timer = setTimeout(() => r(false), 8000);
    v.addEventListener("seeked", () => { clearTimeout(timer); r(true); }, { once: true });
    v.currentTime = t;
  });
  for (const t of times) {
    if (!(await seek(t)) && !(await seek(t + 0.5))) {
      reloads++;
      if (!(await open()) || !(await seek(t))) continue;
    }
    g.drawImage(v, bx * sx, by * sy, bw * sx, bh * sy, 0, 0, c.width, c.height);
    const ext = q.get("jpeg") ? "jpg" : "png";   // JPEG for pictures people look at; PNG (lossless) for OCR
    const blob = await new Promise((r) => c.toBlob(r, ext === "jpg" ? "image/jpeg" : "image/png", 0.85));
    await fetch("/save?name=f" + String(Math.round(t * 10)).padStart(5, "0") + "." + ext, { method: "POST", body: blob });
  }
  done("ok " + times.length + " frames, duration " + v.duration);
})();
</script>
