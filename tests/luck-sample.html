<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Luck sample</title></head>
<body>
<!-- Luck scores over every saved league game (site/games/) and the Nat Dex corpus (tests/corpus/, gitignored), to
     set the luck-word cut-offs in site/app/core.js (LUCK_STEPS). No team sheets, so abilities are guessed as on a
     pasted replay. Run headless with --dump-dom; the numbers land in #out. -->
<pre id="out">running</pre>
<script src="../site/parser.js"></script>
<script src="../site/luck.js"></script>
<script>
const RS = window.ReplayStats, LK = window.Luck;
const q = (xs, p) => { const s = [...xs].sort((a, b) => a - b); return s.length ? s[Math.min(s.length - 1, Math.floor(p * s.length))] : NaN; };
const sd = (xs) => Math.sqrt(xs.reduce((t, x) => t + x * x, 0) / xs.length);  // around 0: luck is centred by design
const f = (x) => x.toFixed(2);
(async () => {
  const out = [];
  const data = { moves: await (await fetch("../site/data/moves.json")).json(), dex: await (await fetch("../site/data/pokedex.json")).json() };
  const lib = (await (await fetch("../site/games/index.json")).json()).games;
  let corpus = [];
  try {
    const listing = await (await fetch("corpus/")).text();
    corpus = [...listing.matchAll(/href="([^"]+\.json)"/g)].map((m) => "corpus/" + decodeURIComponent(m[1]));
  } catch (e) { /* no corpus */ }
  const sets = { league: lib.map((g) => "../site/games/" + g.id + ".json"), corpus };
  const perPlayerGames = new Map();  // league: player -> [player_luck]
  for (const [name, urls] of Object.entries(sets)) {
    const game = [], mon = [];
    for (const u of urls) {
      let rows;
      try { const rep = await (await fetch(u)).json(); rows = RS.gameRows(rep); LK.addLuck(rows, data); } catch (e) { out.push("skip " + u + " " + e.message); continue; }
      const seen = new Set();
      for (const r of rows) {
        if (typeof r.luck === "number" && r.brought) mon.push(r.luck);
        if (typeof r.player_luck !== "number" || seen.has(r.player)) continue;
        seen.add(r.player);
        if (seen.size === 1) game.push(r.player_luck);  // one value per game (the other side is its negative)
        if (name === "league") {
          const k = r.player.toLowerCase().replace(/[^a-z0-9]/g, "").replace(/17$/, "");
          if (!perPlayerGames.has(k)) perPlayerGames.set(k, []);
          perPlayerGames.get(k).push(r.player_luck);
        }
      }
    }
    const abs = game.map(Math.abs), mabs = mon.map(Math.abs);
    out.push(`${name}: ${game.length} games, player luck sd ${f(sd(game))}, |luck| median ${f(q(abs, 0.5))}, 75% ${f(q(abs, 0.75))}, 90% ${f(q(abs, 0.9))}, max ${f(Math.max(...abs))}`);
    out.push(`${name}: ${mon.length} Pokémon-games, luck sd ${f(sd(mon))}, |luck| median ${f(q(mabs, 0.5))}, 75% ${f(q(mabs, 0.75))}, 90% ${f(q(mabs, 0.9))}`);
    window["game_" + name] = game;
  }
  const both = [...window.game_league, ...window.game_corpus];
  const s = sd(both);
  out.push(`all: ${both.length} games, player luck sd ${f(s)}`);
  out.push("season (league, sheets not used): player, games, total, total / (sd * sqrt(games))");
  for (const [k, v] of [...perPlayerGames].sort((a, b) => b[1].reduce((t, x) => t + x, 0) - a[1].reduce((t, x) => t + x, 0))) {
    const tot = v.reduce((t, x) => t + x, 0);
    out.push(`  ${k}: ${v.length}, ${f(tot)}, z ${f(tot / (s * Math.sqrt(v.length)))}`);
  }
  document.getElementById("out").textContent = out.join("\n");
  document.title = "DONE";
})().catch((e) => { document.getElementById("out").textContent = "CRASH " + e.stack; document.title = "CRASH"; });
</script>
</body></html>
