<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replay player</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .wrapper { max-width: 1180px; margin: 0 auto; }
    .problem { padding: 16px; }
  </style>
</head>
<body>
  <!-- Showdown's replay player (replay-embed.js) in a frame of the main page, so its jQuery and CSS stay in here.
       It plays the log from script.battle-log-data. The log is the site's stored copy when there is one. -->
  <div class="wrapper replay-wrapper">
    <input type="hidden" name="replayid" value="">
    <div class="battle"></div>
    <div class="battle-log"></div>
    <div class="replay-controls"></div>
    <div class="replay-controls-2"></div>
  </div>
  <script src="https://play.pokemonshowdown.com/js/replay-embed.js"></script>
  <script>
    (function () {
      "use strict";
      const q = new URLSearchParams(location.search);
      const id = q.get("id") || "";
      // the league's folder (site/<league>/games/), from the league page's Watch button
      const league = /^[a-z0-9-]+$/.test(q.get("league") || "") ? q.get("league") + "/" : "";
      document.querySelector("input[name=replayid]").value = id;
      // as parser.js replayIdFrom: a format with hyphens too (Smogon Tours: smogtours-gen9ou-12345)
      const ok = /^[a-z0-9]+(-[a-z0-9]+)*-\d+(-[a-z0-9]+pw)?$/.test(id);
      const get = (url) => fetch(url).then((r) => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))));
      const replay = !ok ? Promise.reject(new Error("no replay id")) :
        get(league + "games/" + id + ".json")
          .catch(() => get("https://replay.pokemonshowdown.com/" + id + ".json"));
      // Showdown's player gives every log link target="_blank": the set link opens the set in this tab (the league page
      // around this frame) instead of a new one
      document.addEventListener("click", (e) => {
        const a = e.target.closest && e.target.closest('a[href*="?set="]');
        if (!a || e.button || e.ctrlKey || e.metaKey || e.shiftKey) return;
        e.preventDefault();
        window.top.location.href = a.href;
      }, true);
      // replaces the embed's own onload: start once the page's scripts and the log are both here
      window.onload = function () {
        replay.then((r) => {
          const data = document.createElement("script");
          data.type = "text/plain";
          data.className = "battle-log-data";
          // "Game 1 of <a href="/game-bestof3-...">a best-of-3</a>": a link to Showdown's series room, which pointed
          // at this site (a 404) and is gone on Showdown's replay site too. A league game's opens its set's stats on
          // the league page (?set=<this game>: the page finds the rest of the set); anywhere else just the words
          const setLink = league ? "<a href=\"" + league + "?set=" + id + "\" target=\"_top\">$1</a>" : "$1";
          data.textContent = r.log.replace(/<a href="\/game-bestof\d+-[^"]*">([^<]*)<\/a>/g, setLink);
          document.body.appendChild(data);
          if (!window.Replays || !window.Battle) throw new Error("Pokémon Showdown's player didn't load");
          window.Replays.init();
        }).catch((e) => {
          document.querySelector(".wrapper").outerHTML = "";
          const p = document.createElement("p");
          p.className = "problem";
          p.textContent = "Couldn't play this replay (" + e.message + "). Pokémon Showdown may be down; try again later.";
          document.body.appendChild(p);
        });
      };
    })();
  </script>
</body>
</html>
